<div class="flex min-h-full flex-col bg-slate-950 text-slate-100">
  <header class="sticky top-0 z-10 border-b border-slate-800 bg-slate-950/95 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3">
      <span class="text-lg font-semibold tracking-tight">ClipForge</span>

      @if (signedIn()) {
        <nav class="ml-4 flex gap-1 text-sm">
          <a
            routerLink="/review"
            routerLinkActive="bg-slate-800 text-white"
            class="rounded-md px-3 py-1.5 text-slate-300 hover:text-white"
            >Review</a
          >
          <a
            routerLink="/jobs"
            routerLinkActive="bg-slate-800 text-white"
            class="rounded-md px-3 py-1.5 text-slate-300 hover:text-white"
            >Jobs</a
          >
        </nav>
        <button
          type="button"
          class="ml-auto rounded-md px-3 py-1.5 text-sm text-slate-400 hover:text-white"
          (click)="signOut()"
        >
          Sign out
        </button>
      }
    </div>
  </header>

  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-6">
    @if (checking()) {
      <!-- Distinct from signed-out: showing the sign-in screen here would flash
           it at every signed-in user on every load. -->
      <p class="py-16 text-center text-slate-500">Checking your session…</p>
    } @else if (signedIn()) {
      <router-outlet />
    } @else {
      <section class="py-16 text-center">
        <h1 class="text-2xl font-semibold">Sign in to ClipForge</h1>
        <p class="mx-auto mt-3 max-w-md text-slate-400">
          Your clips stay on the machine that rendered them. This signs you in so the queue, the
          scores and your approvals can reach you anywhere.
        </p>
        <button
          type="button"
          class="mt-8 rounded-lg bg-forge-500 px-5 py-2.5 font-medium text-white hover:bg-forge-600"
          (click)="signIn()"
        >
          Continue with Google
        </button>
      </section>
    }
  </main>
</div>
