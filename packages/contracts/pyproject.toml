[project]
name = "clipforge-contracts"
version = "0.0.1"
description = "ClipForge wire protocol — Pydantic v2 models generated from schemas/clipforge.json"
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.12.*"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/clipforge_contracts"]

# ─────────────────────────────────────────────────────────────────────────────
# Generated code is not hand-maintained, so it is not held to the worker's lint
# and typing standards. It is verified by being *regenerated in CI* and compared
# — a stronger check than linting it would be.
[tool.ruff]
exclude = ["generated"]
