name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Contracts.
  #
  # The PWA and the worker are two implementations of one protocol, generated
  # from packages/contracts/schemas/clipforge.json. This job regenerates both
  # halves and fails if the committed output differs — so a schema edit cannot
  # land without its regenerated types (docs/PLAN.md Phase 1, exit criterion 4).
  #
  # It runs first because a stale contract makes the worker and web results
  # meaningless: they would be testing against types nobody will ship.
  # ───────────────────────────────────────────────────────────────────────────
  contracts:
    name: contracts (codegen is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install generators
        run: |
          npm ci --no-fund --no-audit --prefix packages/contracts
          uv sync --locked --project apps/worker

      - name: TypeScript contracts are current
        run: npm --prefix packages/contracts run check

      - name: Pydantic contracts are current
        run: uv run --project apps/worker python packages/contracts/scripts/generate_python.py --check

  # ───────────────────────────────────────────────────────────────────────────
  # Python worker.
  #
  # Installs CORE dependencies only — no `--extra gpu`. Runners have no NVIDIA
  # device, and the `gpu` test tier is deselected here by design. That the core
  # install succeeds without CUDA is itself part of what this job proves.
  # ───────────────────────────────────────────────────────────────────────────
  worker:
    name: worker (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (core + dev)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Unit tier only: no GPU, no network, no emulator. The integration tier
      # needs the Emulator Suite and runs in the `emulator` job below.
      - name: Test (unit tier)
        run: uv run pytest -m unit --cov=clipforge --cov-report=term-missing

  # ───────────────────────────────────────────────────────────────────────────
  # Emulator-backed tiers: security rules, and the transactional lease protocol.
  #
  # Everything here runs against a `demo-` prefixed project id, which puts the
  # Emulator Suite in fully offline mode — no credentials, no billing, no real
  # Firebase project, no network. That is what lets these run on a PR from a
  # fork with no secrets at all.
  # ───────────────────────────────────────────────────────────────────────────
  emulator:
    name: emulator (rules · lease protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json

      # The Firestore and Storage emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install
        run: |
          npm ci --no-fund --no-audit --prefix firebase/tests
          uv sync --locked --project apps/worker

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      # Phase 1, exit criterion 1: per-user isolation on read, write and list,
      # for both Firestore and Storage.
      - name: Security rules
        working-directory: firebase/tests
        run: npm test

      # Phase 1, exit criteria 2 and 3: exactly one worker wins a contested
      # claim, and an expired lease is reclaimed with attempts incremented.
      - name: Lease protocol
        working-directory: apps/worker
        run: >
          ../../firebase/tests/node_modules/.bin/firebase emulators:exec
          --config ../../firebase.json --project demo-clipforge --only firestore
          "uv run pytest -m integration -q"

  # ───────────────────────────────────────────────────────────────────────────
  # Angular PWA. Tests run under Vitest + jsdom, so no browser is needed.
  # ───────────────────────────────────────────────────────────────────────────
  web:
    name: web (lint · types · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  # Parse `tools/doctor.ps1` on a real Windows PowerShell host.
  #
  # This is not busywork: Windows PowerShell 5.1 reads .ps1 files as ANSI unless
  # they carry a BOM, so a stray non-ASCII byte turns into a parser error that
  # only appears on a contributor's machine. The runner has none of ClipForge's
  # dependencies, so we check that the script *parses*, not that it passes.
  # ───────────────────────────────────────────────────────────────────────────
  scripts:
    name: scripts (powershell parse)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path tools -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              Write-Host "FAIL $($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            } else {
              Write-Host "PASS $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Require a UTF-8 BOM on every .ps1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path tools -Filter *.ps1 -Recurse | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "FAIL $($_.Name): missing UTF-8 BOM" -ForegroundColor Red
              $failed = $true
            } else {
              Write-Host "PASS $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
